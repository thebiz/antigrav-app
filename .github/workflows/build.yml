name: AntiGrav-APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Spielseite in die App legen
        run: |
          mkdir -p app/src/main/assets
          cp antigrav.html app/src/main/assets/index.html

      - name: APK bauen
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Bei einem Fehler: die wichtigen Zeilen im Zweig „build-log“ ablegen (dort kann Claude sie lesen)
      - name: Fehlerbericht ablegen
        if: failure()
        run: |
          { echo "Bau ${{ github.run_number }}"; grep -E "^e: |^w: .*error|What went wrong|Could not|FAILURE|error:" -A8 build.log | head -300; echo; echo "----- Ende des Protokolls -----"; tail -120 build.log; } > fehler.txt
          git config user.name "ag-bau"; git config user.email "ag-bau@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          git add -f fehler.txt
          git commit -q -m "Fehlerbericht ${{ github.run_number }}"
          git push -f origin build-log

      - name: APK benennen
        run: cp app/build/outputs/apk/release/app-release.apk "AntiGrav-${{ github.run_number }}.apk"

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AntiGrav ${{ github.run_number }}
          files: AntiGrav-${{ github.run_number }}.apk
          make_latest: true
