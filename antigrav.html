<div id="app"><canvas id="cv"></canvas></div>
<div id="menu"><h1>ANTI<span>GRAV</span></h1><div class="sub">ANTIGRAVITY RACING AT NIGHT</div>
 <div id="mship"><button type="button" id="mshp" aria-label="Previous ship">‹</button><div><b>SHIP</b><span id="mshn"></span><i id="mshi"></i></div><button type="button" id="mshx" aria-label="Next ship">›</button></div>
 <button type="button" class="btn go" id="mstart">START RACE</button>
 <div class="two"><button type="button" class="btn" id="mhsb">Leaderboard</button><button type="button" class="btn" id="mset">Settings</button></div>

<script>

const NV=window.AgNative||{};
const agVib=p=>{try{if(NV.vibrate){NV.vibrate(String([].concat(p).map(x=>Math.round(x)).join(',')));return;}navigator.vibrate&&navigator.vibrate(p);}catch{}};
const AG_SKY_SRC="// Antigrav: Himmel (Strecke, Gleiter und Leuchteffekte werden danach als 3D-Modelle dr\u00fcbergezeichnet)\nuniform float AGZ,AGT,AGFV;uniform vec3 AGRO,AGTA,AGUP;vec3 SUN;\nvec3 sky(vec3 rd,bool full){float h=rd.y,nt=p_sky;float sd=max(0.,dot(rd,SUN));\n vec3 hor=mix(vec3(1.,.5,.26),vec3(.035,.04,.07),nt),top=mix(vec3(.12,.17,.36),vec3(.002,.003,.01),nt),mid=mix(vec3(.62,.32,.42),vec3(.012,.014,.03),nt);\n vec3 c=mix(hor,mid,smoothstep(.0,.12,h));c=mix(c,top,smoothstep(.1,.55,h));\n c+=vec3(1.,.6,.3)*pow(sd,10.)*.22*(1.-nt)+vec3(1.,.82,.55)*pow(sd,1400.)*5.*(1.-nt);\n // Nacht: Sterne, Mond, Milchstra\u00dfen-Schleier\n if(nt>.01&&h>-.02){vec2 sp=vec2(atan(rd.x,rd.z)*90.,h*160.);vec2 ci=floor(sp);float st=step(.985,hash(ci))*smoothstep(.0,.08,h);float tw=.6+.4*sin(AGT*(2.+hash(ci+3.)*4.)+hash(ci)*20.);\n  c+=vec3(.75,.8,1.)*st*tw*(.35+.65*hash(ci+7.))*nt*(1.-step(.5,length(fract(sp)-.5)*2.));\n  vec3 md=normalize(vec3(.5,.32,.8));float mo=dot(rd,md);c+=vec3(.85,.9,1.)*smoothstep(.9994,.9997,mo)*nt+vec3(.25,.3,.45)*pow(max(0.,mo),60.)*.25*nt;\n  c+=vec3(.05,.05,.09)*fbm(vec2(atan(rd.x,rd.z)*3.,h*6.)+3.)*smoothstep(.05,.4,h)*smoothstep(.9,.3,abs(rd.x-.3))*nt;}\n if(full&&h>.01){vec2 cu=rd.xz/(h+.06)*.55;float cl=fbm(cu*vec2(1.,3.)+vec2(0.,AGT*.01));cl=smoothstep(.5,.85,cl)*smoothstep(.01,.12,h)*(1.-smoothstep(.35,.7,h));\n  vec3 cc=mix(mix(vec3(1.,.55,.35),vec3(.03,.035,.06),nt),vec3(.95,.75,.6),pow(sd,3.)*(1.-nt));c=mix(c,cc*.9,cl*.75);}\n // Gebirgsketten: fern hell im Dunst, nah dunkler, Grate vom Abendlicht gestreift\n float an=atan(rd.x,rd.z);\n for(int k=0;k<3;k++){float fk=float(k);float fr=1.6+fk*1.7;\n  float mh=.015+.05*(1.-fk*.25)*fbm(vec2(an*fr+fk*7.3,fk*3.1))+.035*fk*noise(vec2(an*fr*3.,fk));mh-=.025*fk;\n  if(h<mh){float hz=.75-fk*.28;vec3 mc=mix(mix(vec3(.12,.08,.14),vec3(.004,.005,.01),nt),hor*.9,hz*(1.-nt*.6));\n   mc+=mix(vec3(1.,.55,.3),vec3(.2),nt)*smoothstep(mh-.006,mh,h)*pow(sd,2.)*.6*(1.-fk*.3);c=mc;}}\n // unter dem Horizont: Talnebel, Sonne spiegelt sich darin\n if(h<-.02){float fd=smoothstep(-.02,-.35,h);c=mix(c,mix(hor*.55,mix(vec3(.05,.05,.09),vec3(.01,.01,.02),nt),fd),smoothstep(-.02,-.06,h));\n  c+=vec3(1.,.6,.3)*pow(max(0.,dot(normalize(vec3(rd.x,-rd.y,rd.z)),SUN)),30.)*.3*(1.-nt)*(1.-fd);}\n return c;}\nvoid main(){vec2 c0=cuv();SUN=normalize(vec3(-.4,.07,1.));vec3 cf=normalize(AGTA-AGRO),cr=normalize(cross(AGUP,cf)),cu=cross(cf,cr);\n vec3 rd=normalize(cf*max(AGFV,.5)+cr*c0.x+cu*c0.y);vec3 col=sky(rd,true)*mix(1.,.4,p_sky);if(AGZ>99.)col=vec3(1.);\n col=(col*(2.51*col+.03))/(col*(2.43*col+.59)+.14);gl_FragColor=vec4(pow(clamp(col,0.,1.),vec3(.95)),1.);}\n";
// ---------- Antigrav: echte 3D-Modelle der Gleiter (Dateien ship-*.bin, aus glTF umgepackt) ----------
// Pose und Kamera werden exakt wie im Strecken-Shader gerechnet, das Modell wird danach mit Tiefenpuffer drübergezeichnet.
const VZ_SHIP_VS=`precision highp float;attribute vec3 p,nn;attribute vec2 tc;uniform vec3 S0,SR,SU,SF,RO,CF,CR,CU;uniform float FOV,A,JET,ISJ;varying vec2 vt;varying vec3 vn,vw;
void main(){vec3 q=p;if(ISJ>.5&&q.z<-.62)q.z=-.62+(q.z+.62)*JET;
 vec3 w=S0-SR*q.x+SU*q.y+SF*q.z;vn=normalize(-SR*nn.x+SU*nn.y+SF*nn.z);vw=w;vt=tc;
 vec3 v=w-RO;float z=dot(v,CF);const float n=.1,f=220.;
 gl_Position=vec4(dot(v,CR)*FOV*2./A,dot(v,CU)*FOV*2.,(f+n)/(f-n)*z-2.*f*n/(f-n),z);}`;
const VZ_SHIP_FS=`precision highp float;varying vec2 vt;varying vec3 vn,vw;uniform sampler2D TB,TM,TE;uniform float HM,HE,EMF,ALP,MET,ROU,ADD,NT,BO,BB,SHL,GH;uniform vec3 RO,SUN,TINT;
vec3 skyc(vec3 d){float h=d.y;vec3 hor=mix(vec3(1.,.5,.26),vec3(.16,.12,.24),NT),top=mix(vec3(.12,.17,.36),vec3(.01,.015,.05),NT),mid=mix(vec3(.62,.32,.42),vec3(.05,.04,.1),NT);
 vec3 c=mix(hor,mid,smoothstep(.0,.12,h));c=mix(c,top,smoothstep(.1,.55,h));if(h<0.)c=mix(c,vec3(.06,.06,.08),smoothstep(0.,-.3,h));return c+vec3(1.,.7,.4)*pow(max(0.,dot(d,SUN)),20.)*(1.-NT);}
void main(){vec4 tb=texture2D(TB,vt);vec3 alb=pow(tb.rgb,vec3(2.2));float lm=dot(alb,vec3(.3,.5,.2));alb=mix(alb,lm*TINT*1.5,step(.01,abs(TINT.x+TINT.y+TINT.z-3.))*.7);float met=MET,rou=ROU;
 if(HM>.5){vec4 m=texture2D(TM,vt);rou*=m.g;met*=m.b;}
 vec3 n=normalize(vn);vec3 vd=normalize(vw-RO);if(dot(n,vd)>0.)n=-n;
 vec3 L2=normalize(vec3(.35,.8,-.7));vec3 sunC=mix(vec3(1.25,.85,.6),vec3(.35,.38,.55),NT),c2=mix(vec3(.75,.8,.95),vec3(.45,.5,.7),NT),amb=mix(vec3(.32,.3,.42),vec3(.1,.11,.18),NT);
 vec3 rf=reflect(vd,n);float sh=2./max(.02,rou*rou)+2.;
 float d1=max(0.,dot(n,SUN)),d2=max(0.,dot(n,L2));float fr=.04+.96*pow(1.-max(0.,dot(n,-vd)),5.);
 vec3 F0=mix(vec3(.04),alb,met);vec3 dc=alb*(1.-met);
 vec3 col=dc*(sunC*d1*.9+c2*d2*.75+amb*(.55+.45*n.y))+(sunC*pow(max(0.,dot(rf,SUN)),sh)+c2*.8*pow(max(0.,dot(rf,L2)),sh))*F0*(1.-rou*.6)+skyc(rf)*mix(F0,vec3(1.),fr)*(1.-rou)*.9;
 if(HE>.5)col+=pow(texture2D(TE,vt).rgb,vec3(2.2))*EMF*(1.+1.2*BB+2.5*BO);
 if(ADD>.5){float k=.35+1.2*BB+1.7*BO;col=pow(tb.rgb,vec3(2.2))*tb.a*.6*k;if(HE>.5)col+=pow(texture2D(TE,vt).rgb,vec3(2.2))*.7*k;}
 col+=vec3(.3,.7,1.)*SHL*(.4+.4*fr);
 if(GH>.5){float rim=pow(1.-max(0.,dot(n,-vd)),2.);gl_FragColor=vec4(vec3(.3,.75,1.)*(.12+.95*rim)+vec3(.5,.8,1.)*lm*.6,1.);return;}   // Geist: durchsichtig, leuchtende Kanten
 col=(col*(2.51*col+.03))/(col*(2.43*col+.59)+.14);col=pow(clamp(col,0.,1.),vec3(.95));
 gl_FragColor=vec4(col,ADD>.5?1.:tb.a*ALP);}`;
// Alle Gleiter: gleiches Format, gleiche Länge (Nase vorn bei +z), eigene Düsenlage (eng = Höhe, z hinten)
const AG_SHIPS=[
 {id:'feisar',nm:'Feisar',cr:'“WipeOut – Feisar” by Nobby76, CC BY 4.0'},
 {id:'qirex',nm:'Qirex',cr:'“WipeOut – Qirex” by Nobby76, CC BY 4.0'},
 {id:'assegai',nm:'Assegai',cr:'“WipeOut – Assegai” by Nobby76, CC BY 4.0'},
 {id:'apex',nm:'Apex',cr:'“Apex Wipeout Anti-grav Racer” by rafta, CC BY-NC 4.0'},
 {id:'rhsx',nm:'RHS-X',cr:'“RHS-X” by Hassan Bassassi, CC BY 4.0'}];
const agShipIx=i=>Math.max(0,Math.min(AG_SHIPS.length-1,Math.round(+i||0)));
function vizShipProg(v){const gl=v.gl;if(v.shipPg)return v.shipPg;
  const c=(t,src)=>{const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;};
  const pg=gl.createProgram();gl.attachShader(pg,c(gl.VERTEX_SHADER,VZ_SHIP_VS));gl.attachShader(pg,c(gl.FRAGMENT_SHADER,VZ_SHIP_FS));
  gl.bindAttribLocation(pg,0,'p');gl.bindAttribLocation(pg,1,'nn');gl.bindAttribLocation(pg,2,'tc');gl.linkProgram(pg);if(!gl.getProgramParameter(pg,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(pg));
  const u={};['S0','SR','SU','SF','RO','CF','CR','CU','FOV','A','JET','ISJ','TB','TM','TE','HM','HE','EMF','ALP','MET','ROU','ADD','NT','BO','BB','SUN','TINT','SHL','GH'].forEach(k=>u[k]=gl.getUniformLocation(pg,k));
  return v.shipPg={pg,u};}
function vizShipModel(v,i){const gl=v.gl;v.ships=v.ships||[];i=agShipIx(i);if(v.ships[i])return v.ships[i];const sh=v.ships[i]={ok:false,prims:[],mats:[],eng:[.155,-.74]};
  fetch('ship-'+AG_SHIPS[i].id+'.bin').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(async buf=>{
    const n=new DataView(buf).getUint32(0,true),j=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,4,n))),base=4+n;if(j.eng)sh.eng=j.eng;
    const texs=await Promise.all(j.imgs.map(async im=>{const bmp=await createImageBitmap(new Blob([new Uint8Array(buf,base+im.off,im.len)],{type:im.mime}));
      const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,bmp);gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);return t;}));
    sh.mats=j.mats.map(m=>Object.assign({},m,{tb:texs[m.base],tm:m.mr>=0?texs[m.mr]:null,te:m.emi>=0?texs[m.emi]:null}));
    for(const p of j.prims){const mk=(off,cnt)=>{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(buf,base+off,cnt),gl.STATIC_DRAW);return b;};
      const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(buf,base+p.idx,p.ni),gl.STATIC_DRAW);
      sh.prims.push({pos:mk(p.pos,p.n*3),nrm:mk(p.nrm,p.n*3),uv:mk(p.uv,p.n*2),ib,ni:p.ni,mat:p.mat,jet:p.jet});}
    sh.ok=true;}).catch(e=>{console.warn('[AntiGrav] Gleiter '+AG_SHIPS[i].id,e);sh.bad=true;});
  return sh;}
// ---------- Antigrav als Spiel: Rennen gegen drei Gegner, echte Flugphysik (Nase lenken, Driften), Sprünge, Tunnel, Waffen ----------
const AG_ZST=20,AG_LAP=700,AG_NL=3,AG_ZFI=AG_ZST+AG_NL*AG_LAP;
// Strecke – exakt wie im Shader: Rundkurs, lange Geraden, weite Kurven (Kurvigkeit pc, Breite über TW)
const agLz=z=>((z-20)%700+700)%700+20,agS=u=>{u=Math.max(0,Math.min(1,u));return u*u*u*(u*(u*6-15)+10);},agS1=u=>u<0||u>1?0:30*u*u*(u-1)*(u-1),agS2=u=>u<0||u>1?0:60*u*(u-1)*(2*u-1);
const AG_SEG=[[80,120,18],[240,140,-26],[420,110,14],[560,110,-6]];
const AGT_={pc:1,tw:2.1,bkf:1,
  px:z=>{const l=agLz(z);let r=0;for(const [a,n,d] of AG_SEG)r+=d*agS((l-a)/n);return AGT_.pc*r;},
  dpx:z=>{const l=agLz(z);let r=0;for(const [a,n,d] of AG_SEG)r+=d/n*agS1((l-a)/n);return AGT_.pc*r;},
  d2px:z=>{const l=agLz(z);let r=0;for(const [a,n,d] of AG_SEG)r+=d/(n*n)*agS2((l-a)/n);return AGT_.pc*r;},
  py:z=>{const l=z-20;return 2.4*Math.sin(l*.017951958)+.8*Math.sin(l*.044879895+1);},dpy:z=>{const l=z-20;return 2.4*.017951958*Math.cos(l*.017951958)+.8*.044879895*Math.cos(l*.044879895+1);},
  rmp:z=>{z=agLz(z);const Jn=Math.ceil((z-60)/350)*350+60;if(Jn<300||Jn>700)return 0;const u=Math.max(0,Math.min(1,(z-(Jn-10))/10));return .45*u*u;},
  gap:z=>{z=agLz(z);const J=Math.floor((z-60)/350)*350+60;if(J<300)return false;return z>J&&z<J+7;}};
AGT_.bk=z=>Math.max(-.6,Math.min(.6,-AGT_.d2px(z)*60))*AGT_.bkf;
const agMd=(k,n)=>(k%n+n)%n;AGT_.bpx=k=>-Math.sign(AGT_.d2px(k*35+6))*.5*AGT_.tw/1.6;AGT_.wpx=k=>.55*Math.sin(agMd(k,20)*1.3+.4)*AGT_.tw/1.6;AGT_.obx=k=>.7*Math.sin(agMd(k,14)*2.7+.5)*AGT_.tw/1.6;
AGT_.obOk=k=>{const zc=agLz(k*50+25);let jd=((zc-60)%350+350)%350;jd=Math.min(jd,350-jd);return zc>=90&&jd>=18&&zc<=690&&agMd(k,2)===0;};
const AG_WN={rak:'Missile',lenk:'Homing',mine:'Mines',schild:'Shield',turbo:'Turbo',beben:'Quake',auto:'Auto',wand:'Wall'};
const AG_WP=[['rak',.21],['lenk',.17],['mine',.13],['schild',.12],['turbo',.14],['beben',.08],['auto',.07],['wand',.08]];
const agPickW=()=>{let r=Math.random();for(const [k,p] of AG_WP){if((r-=p)<0)return k;}return 'rak';};
// Abstimmwerte der Lenkung (Reglerleiste im Spiel, gespeichert): Anlaufzeit, Anfangsstärke, Kurvenform, max. Drehung, Kippen: Bereich und Totzone

const GH_REPO='thebiz/antigrav-app';let updBusy=false;
const agTok=()=>{try{return localStorage.getItem('ag_ghtok')||'';}catch{return '';}};
function ghToken(){return new Promise(res=>{agDlg('GitHub token','<p>Lets AntiGrav look for new versions in your private repository. On GitHub: Settings → Developer settings → Fine-grained tokens → Generate new token. Repository: antigrav-app. Permission: Contents – Read-only.</p><input id="tokin" type="text" autocomplete="off" placeholder="github_pat_…" value="'+agEsc(agTok())+'">',
  [['Save',d=>{const t=d.querySelector('#tokin').value.trim();try{localStorage.setItem('ag_ghtok',t);}catch{}res(!!t);}],['Cancel',()=>res(false)]]);});}
async function checkUpdate(manual){if(typeof NV.installUpdate!=='function'){if(manual)toast('Updates only work in the app.');return;}if(updBusy)return;
  const tok=agTok();if(!tok){if(manual&&await ghToken())checkUpdate(true);return;}
  try{if(manual)toast('Checking for updates …');
    const r=await fetch(`https://api.github.com/repos/${GH_REPO}/releases/latest`,{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},cache:'no-store'});
    if(r.status===401){if(manual)toast('The GitHub token is wrong or has expired.');return;}
    if(r.status===404||r.status===403){if(manual)toast('No access to the repository – does the token have “Contents: Read-only” for antigrav-app?',5000);return;}
    if(!r.ok){if(manual)toast('GitHub is not responding ('+r.status+').');return;}
    const j=await r.json(),n=+(String(j.tag_name||'').match(/\d+/)||[0])[0],cur=+(NV.buildNr?.()||0);const a=(j.assets||[]).find(x=>/\.apk$/i.test(x.name));
    if(!a||n<=cur){if(manual)toast(`AntiGrav is up to date (version ${cur}).`);return;}
    if(!manual&&v.state==='game'){setTimeout(()=>checkUpdate(false),60000);return;}
    agDlg('Update available',`<p>AntiGrav ${n} is ready – you have ${cur}. Install now? Your leaderboard and settings are kept.</p>`,[['Install',()=>{updBusy=true;toast('Downloading update …');NV.installUpdate(a.url,tok);}],['Later',null]]);
  }catch(e){updBusy=false;if(manual)toast('Update check failed: '+(e&&e.message||e));}}
window.__nvEv=(k,d)=>{
  if(k==='updreq'){setTimeout(()=>checkUpdate(true),300);}
  else if(k==='upd'){if(d.e){updBusy=false;toast(d.e==='perm'?'Please allow “Install unknown apps” for AntiGrav, then try again.':'Update failed: '+d.e,5000);}else if(d.ok)toast('Starting installation …');else if(d.p!=null&&d.p%10===0)toast('Downloading update … '+d.p+' %',1500);}
  else if(k==='pause'){if(v.state==='game'&&v.agg&&!v.agg.rep&&v.agg.st==='race')agPause(v,true);const A=v.agA;if(A&&A.ok)try{A.master.gain.setTargetAtTime(0,A.C.currentTime,.02);}catch{}}
  else if(k==='resume'){try{NV.immersive?.(true);}catch{}}};
setTimeout(()=>checkUpdate(false),4000);
document.addEventListener('selectstart',e=>{if(!e.target.closest('input,textarea'))e.preventDefault();});

</script></body></html>
